<!DOCTYPE html>
<html>
<head>
    <title>Test Document Endpoint</title>
    <style>
        body { font-family: Arial; margin: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin: 10px 0; }
        .success { background: #d4edda; border-color: #28a745; }
        .error { background: #f8d7da; border-color: #dc3545; }
        button { padding: 10px 20px; font-size: 14px; cursor: pointer; }
        pre { background: #f5f5f5; padding: 10px; overflow-x: auto; }
    </style>
</head>
<body>
    <h1>Test: Document Content Endpoint</h1>

    <div class="box">
        <h2>Configuration</h2>
        <p>API Base URL: <code id="baseUrl"></code></p>
        <p>Token: <code id="token"></code></p>
        <p>File: <code>GCT_notes_exemples_50-1.pdf</code></p>
    </div>

    <div class="box">
        <h2>Test Options</h2>
        <button onclick="testEndpoint('GCT_notes_exemples_50-1.pdf')">
            Test with GCT_notes_exemples_50-1.pdf
        </button>
        <button onclick="testEndpoint('GCT_notes_exemples_50-2.pdf')">
            Test with GCT_notes_exemples_50-2.pdf
        </button>
    </div>

    <div id="result" class="box" style="display:none;">
        <h2>Result</h2>
        <div id="resultContent"></div>
    </div>

    <script>
        // Get config from localStorage (set by main app)
        const token = localStorage.getItem('gct_token');
        const apiBase = localStorage.getItem('gct_api_base') || '';

        document.getElementById('baseUrl').textContent = apiBase || '(relative paths via proxy)';
        document.getElementById('token').textContent = token ? `${token.substring(0, 10)}...` : '(not set)';

        async function testEndpoint(fileName) {
            const resultDiv = document.getElementById('result');
            const contentDiv = document.getElementById('resultContent');

            resultDiv.style.display = 'block';
            contentDiv.innerHTML = '<p>Loading...</p>';

            try {
                // Build URL
                const url = `${apiBase}/api/v1/documents/${encodeURIComponent(fileName)}/content`;
                console.log('Fetching:', url);

                // Build headers
                const headers = {
                    'Content-Type': 'application/json'
                };
                if (token) {
                    headers['Authorization'] = `Bearer ${token}`;
                }

                // Fetch
                const response = await fetch(url, { headers });

                console.log('Status:', response.status);
                const data = await response.json();
                console.log('Response:', data);

                if (response.ok) {
                    resultDiv.className = 'box success';
                    contentDiv.innerHTML = `
                        <h3>Success!</h3>
                        <p><strong>File:</strong> ${data.file_name}</p>
                        <p><strong>Page:</strong> ${data.page_number} / ${data.total_pages}</p>
                        <p><strong>Content length:</strong> ${data.content.length} chars</p>
                        <details>
                            <summary>Show content</summary>
                            <pre>${data.content.substring(0, 500)}...</pre>
                        </details>
                    `;
                } else {
                    resultDiv.className = 'box error';
                    contentDiv.innerHTML = `
                        <h3>Error ${response.status}</h3>
                        <p><strong>Detail:</strong> ${data.detail}</p>
                        <details>
                            <summary>Full response</summary>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </details>
                    `;
                }
            } catch (err) {
                resultDiv.className = 'box error';
                contentDiv.innerHTML = `
                    <h3>Network Error</h3>
                    <p><strong>Message:</strong> ${err.message}</p>
                    <details>
                        <summary>Debug info</summary>
                        <pre>
URL: ${apiBase}/api/v1/documents/[file_name]/content
Token: ${token ? 'Set' : 'NOT SET'}
Error: ${err.toString()}
                        </pre>
                    </details>
                    <p style="color: red; margin-top: 10px;">
                        <strong>Possible causes:</strong>
                        <ul>
                            <li>Backend is not running (start with: ./venv/Scripts/python.exe -m uvicorn main:app --host 127.0.0.1 --port 8000)</li>
                            <li>Token is not set (login first in the main app)</li>
                            <li>CORS is not enabled (check backend .env)</li>
                            <li>API URL is wrong (check VITE_API_BASE_URL)</li>
                        </ul>
                    </p>
                `;
            }
        }
    </script>
</body>
</html>
